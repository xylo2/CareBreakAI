name: CI & Release Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests & V8 coverage
        run: python tools/run_tests_clip.py --no-clipboard

      - name: Build store packages & assets
        run: |
          python tools/build_zip.py
          python tools/generate_store_assets.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carebreak-store-packages
          path: dist/

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/store_assets/*.png
